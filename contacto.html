    <h1>Formulario de Contacto</h1>

    <p>¿Tienes alguna sugerencia, reclamo o recomendación? - Contáctanos</p>


    <label>Nombre completo:</label>
    <input id="nombre" type="text" placeholder="Jonh Doe" required></input>

    <label>Teléfono:</label>
    <input id="telefonoRegistro" type="text" placeholder="+56 9 8765 4321" required></input>
    
    <label>Correo:</label>
    <input id="correoRegistro" type="email" placeholder="jonhdoe@email.com" required></input>
    

    
    <label>Motivo de Contacto</label>
    <textarea id="motivo" rows="10" placeholder="Ingrese como máximo 10 líneas." required></textarea>
