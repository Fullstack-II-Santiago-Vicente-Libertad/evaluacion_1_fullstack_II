    <h1>Formulario de Contacto</h1>

    <p>¿Tienes alguna sugerencia, reclamo o recomendación? - Contáctanos</p>


    <form id="formulario">

        <label>Nombre completo:</label>
        <input id="nombre" type="text" placeholder="Juanito Pérez" required></input>

        <label>Teléfono:</label>
        <input id="telefono" type="text" placeholder="+56 9 8765 4321" required></input>
        
        <label>Correo:</label>
        <input id="correo" type="text" placeholder="juanito@email.com" ></input>
        
        <label>Motivo de Contacto</label>
        <textarea id="motivo" rows="10" placeholder="Ingrese como máximo 500 caracteres."></textarea>

        <button>Enviar</button>

        <p id="mensaje"></p>

    </form>
