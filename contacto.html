    <h1>Formulario de Contacto</h1>

    <p>¿Tienes alguna sugerencia, reclamo o recomendación? - Contáctanos</p>


    <form id="formulario">

<fieldset>
    <legend>Información personal</legend>
        <label for="nombre">Nombre completo:</label>
        <input id="nombre" type="text" placeholder="Juanito Pérez" required></input>

        <label for="telefono">Teléfono:</label>
        <input id="telefono" type="text" placeholder="+56 9 8765 4321" required></input>
        
        <label for="correo">Correo:</label>
        <input id="correo" type="text" placeholder="juanito@email.com" ></input>
</fieldset>

<fieldset>
    <legend>Mensaje</legend>
        <label for="motivo">Motivo de Contacto: </label>
        <textarea id="motivo" rows="4" placeholder="Ingrese como máximo 500 caracteres."></textarea>
</fieldset>
        


        <button>Enviar</button>

        <p id="mensaje"></p>

    </form>
